[package]
name = "split-include"
version = "0.1.0"
authors = ["Romain Déoux <romain.deoux@arrive.com>"]
edition = "2024"
rust-version = "1.85"
description = "Split an autoconf.h generated file into several formats (Assembler, C, Perl and Python)"
publish = false

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
log = "0.4.35"
simple_logger = "5.2.0"

[dev-dependencies]
tempfile = "3.27.0"
